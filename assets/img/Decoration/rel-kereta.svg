<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="xMidYMax meet">
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e6eefc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- sleepers -->
  <g fill="#f8fafc" stroke="#d1e3ff" stroke-width="2">
    <rect x="0" y="70" width="2200" height="10" rx="3"/>
    <g id="sleeper" transform="translate(20,62)">
      <!-- repeat sleepers using pattern-like spacing visually -->
      <rect x="0" y="0" width="60" height="22" rx="4"/>
      <rect x="120" y="0" width="60" height="22" rx="4"/>
      <rect x="240" y="0" width="60" height="22" rx="4"/>
      <rect x="360" y="0" width="60" height="22" rx="4"/>
      <rect x="480" y="0" width="60" height="22" rx="4"/>
      <rect x="600" y="0" width="60" height="22" rx="4"/>
      <rect x="720" y="0" width="60" height="22" rx="4"/>
      <rect x="840" y="0" width="60" height="22" rx="4"/>
      <rect x="960" y="0" width="60" height="22" rx="4"/>
      <rect x="1080" y="0" width="60" height="22" rx="4"/>
    </g>
  </g>

  <!-- rails -->
  <path d="M0 40 C200 32,400 32,600 40 S1000 48,1200 40" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M0 50 C200 42,400 42,600 50 S1000 58,1200 50" fill="none" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
</svg>